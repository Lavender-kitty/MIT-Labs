<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="main-header">
            <h1>Music Player</h1>
        </header>

        <section class="sidebar">
            <div class="sidebar-section">
                <h2 class="sidebar-header">Artists</h2>
                <div id="artists-list" class="artists-grid">
                </div>
            </div>
            <div class="sidebar-section">
                <h2 class="sidebar-header">Queue</h2>
                <ul id="queue-list" class="queue-list">
                </ul>
            </div>
        </section>

        <section class="content-area">
            <div id="songs-container">
                <h2 class="sub-header">Choose an artist...</h2>
                <div id="songs-list" class="songs-list">
                </div>
            </div>
        </section>

        <footer class="player-bar">
            <div class="track-info">
                <img id="current-track-img" src="images/placeholder.png" alt="Album Art" class="track-art">
                <div class="track-details">
                    <div id="current-track-title" class="track-name">Song Title</div>
                    <div id="current-track-artist" class="track-artist">Artist</div>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button id="prev-btn" class="ctrl-btn">⏮</button>
                    <button id="play-pause-btn" class="ctrl-btn play-btn">▶</button>
                    <button id="next-btn" class="ctrl-btn">⏭</button>
                </div>
                <div class="progress-container">
                    <span id="current-time">00:00</span>
                    <input type="range" id="progress-bar" value="0" min="0" max="100" class="progress-slider">
                    <span id="total-duration">00:00</span>
                </div>
            </div>

            <div class="volume-container">
                <span class="volume-icon">🔊</span>
                <input type="range" id="volume-slider" value="80" min="0" max="100" class="volume-slider">
            </div>
        </footer>
    </div>

    <audio id="audio-player"></audio>
    <script src="script.js"></script>
</body>
</html>
